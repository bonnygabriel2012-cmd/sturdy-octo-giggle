// ── M&M MEETING MODULE ────────────────────────────────────────────────
function mmView(){
  const wrap=div('');
  wrap.appendChild(el('div','sh','🤝 M&M Meetings'));
  wrap.appendChild(el('div','sh-sub','Morbidity and Mortality meeting management'));

  if(S.sub==='new'){return mmFormView(wrap);}
  if(S.sub==='detail'&&S.sel){return mmDetailView(wrap);}

  if(can('add')){
    const nb=btn('btn btn-p','➕ New M&M Meeting',function(){S.sel=null;go('mm','new');});
    nb.style.marginBottom='12px';wrap.appendChild(nb);
  }

  const list=div('');list.id='mm-list';
  list.innerHTML='<div class="loading-wrap"><div class="loader"></div><span>Loading meetings...</span></div>';
  wrap.appendChild(list);

  sbGet('dghdap_meetings','hospital_key=eq.'+HOSPITAL.key+'&order=meeting_date.desc&limit=20').then(function(data){
    list.innerHTML='';
    if(!data||!data.length){list.innerHTML='<div class="empty"><div class="empty-icon">🤝</div><div class="empty-text">No M&M meetings recorded yet.<br>Tap New M&M Meeting to begin.</div></div>';return;}
    data.forEach(function(m){
      const card=div('rec-card');
      card.innerHTML='<div class="rec-name">M&M Meeting — '+fmtDate(m.meeting_date)+'</div>'
        +'<div class="rec-meta"><span>'+( m.chairperson||'')+'</span>'+(m.venue?'<span>'+m.venue+'</span>':'')+'</div>';
      card.addEventListener('click',function(){go('mm','detail',m);});
      list.appendChild(card);
    });
  }).catch(function(){list.innerHTML='<div class="empty"><div class="empty-icon">📶</div><div class="empty-text">Could not load meetings.<br>Check internet connection.</div></div>';});
  return wrap;
}

function mmFormView(wrap){
  const m={meeting_date:today(),hospital_key:HOSPITAL.key};
  wrap.appendChild(el('div','sh','🤝 New M&M Meeting'));
  const card=div('card');
  const fg5=div('fg');
  function mI(l,k,t,p,fw){const i=inp('inp');i.type=t||'text';i.value=m[k]||'';if(p)i.placeholder=p;i.addEventListener('input',function(e){m[k]=e.target.value;});fg5.appendChild(fld(l,i,fw));}
  function mT(l,k,p,fw){const t=el('textarea','inp');t.value=m[k]||'';if(p)t.placeholder=p;t.style.minHeight='72px';t.addEventListener('input',function(e){m[k]=e.target.value;});fg5.appendChild(fld(l,t,fw));}
  mI('Meeting Date *','meeting_date','date');
  mI('Chairperson','chairperson','text','Name of chairperson');
  mI('Venue','venue','text','Meeting location');
  mT('Attendees','attendees','List all attendees and their roles',true);
  mT('Cases Discussed','cases_discussed','List MRN numbers and case summaries discussed',true);
  mT('Decisions and Actions','decisions','Key decisions and action items from the meeting',true);
  mT('Other Business','other_business','Any other matters discussed',true);
  mI('Next Meeting Date','next_meeting_date','date');
  card.appendChild(fg5);wrap.appendChild(card);
  const nav=div('fnav');
  nav.appendChild(btn('btn btn-s','← Back',function(){go('mm');}));
  nav.appendChild(btn('btn btn-p','✔ Save Meeting',async function(){
    if(!m.meeting_date){notify('Meeting date is required','err');return;}
    try{await sbPost('dghdap_meetings',m);notify('Meeting saved ✓','ok');go('mm');}
    catch(e){notify('Error: '+e.message,'err');}
  }));
  wrap.appendChild(nav);
  return wrap;
}

function mmDetailView(wrap){
  const m=S.sel;
  wrap.appendChild(el('div','sh','M&M Meeting'));
  wrap.appendChild(el('div','sh-sub',fmtDate(m.meeting_date)+(m.venue?' · '+m.venue:'')));
  const card=div('card');
  [['Date',fmtDate(m.meeting_date)],['Chairperson',m.chairperson||'—'],['Venue',m.venue||'—'],['Attendees',m.attendees||'—'],['Cases Discussed',m.cases_discussed||'—'],['Decisions and Actions',m.decisions||'—'],['Other Business',m.other_business||'—'],['Next Meeting',fmtDate(m.next_meeting_date)]].forEach(function(row){
    const d=div('det-row');d.innerHTML='<span class="det-lbl">'+row[0]+'</span><span class="det-val">'+row[1]+'</span>';card.appendChild(d);
  });
  wrap.appendChild(card);
  const nav=div('fnav');
  nav.appendChild(btn('btn btn-s','← Back',function(){go('mm');}));
  // Export PDF minutes
  nav.appendChild(btn('btn btn-g btn-sm','📄 Export Minutes',function(){exportMMPDF(m);}));
  wrap.appendChild(nav);
  return wrap;
}

    +'.hdr{background:#0B2545;color:#fff;padding:22pt 28pt;}.hdr h1{font-size:18pt;font-weight:800;margin-bottom:4pt;}.hdr p{font-size:10pt;color:#93C5FD;}'
    +'.page{padding:20pt 28pt;}.sec{margin-bottom:18pt;}.sec-title{font-size:12pt;font-weight:800;color:#0B2545;border-bottom:2px solid #0B2545;padding-bottom:4pt;margin-bottom:8pt;}'
    +'.field{margin-bottom:10pt;}.field-lbl{font-size:9pt;font-weight:700;color:#475569;text-transform:uppercase;letter-spacing:1px;margin-bottom:3pt;}.field-val{font-size:11pt;color:#111;white-space:pre-wrap;line-height:1.75;}'
    +'.sig-grid{display:grid;grid-template-columns:1fr 1fr;gap:30pt;margin-top:24pt;}.sig-block{border-top:2px solid #0B2545;padding-top:8pt;}'
    +'.sig-name{font-size:12pt;font-weight:700;color:#0B2545;margin-bottom:3pt;}.sig-det{font-size:10pt;color:#475569;line-height:1.6;}'
    +'.foot{border-top:1px solid #E2E8F0;margin-top:20pt;padding-top:7pt;font-size:8.5pt;color:#94A3B8;text-align:center;}'
    +'</style></head><body>'
    +'<div class="hdr"><h1>Morbidity &amp; Mortality Meeting — Formal Minutes</h1><p>'+HOSPITAL.name+' · '+HOSPITAL.province+', Papua New Guinea</p></div>'
    +'<div class="page">'
    +'<div class="field"><div class="field-lbl">Meeting Date</div><div class="field-val">'+fmtDate(m.meeting_date)+'</div></div>'
    +'<div class="field"><div class="field-lbl">Chairperson</div><div class="field-val">'+(m.chairperson||'—')+'</div></div>'
    +'<div class="field"><div class="field-lbl">Venue</div><div class="field-val">'+(m.venue||'—')+'</div></div>'
    +'<div class="field"><div class="field-lbl">Attendees</div><div class="field-val">'+(m.attendees||'—')+'</div></div>'
    +'<div class="sec"><div class="sec-title">Cases Discussed</div><div class="field-val">'+(m.cases_discussed||'No cases documented')+'</div></div>'
    +'<div class="sec"><div class="sec-title">Decisions and Action Items</div><div class="field-val">'+(m.decisions||'No decisions documented')+'</div></div>'
    +'<div class="sec"><div class="sec-title">Other Business</div><div class="field-val">'+(m.other_business||'None')+'</div></div>'
    +'<div class="field"><div class="field-lbl">Next Meeting Date</div><div class="field-val">'+fmtDate(m.next_meeting_date)+'</div></div>'
    +'<div class="sig-grid"><div class="sig-block"><div class="sig-name">Chairperson</div><div class="sig-det">'+(m.chairperson||'')+'<br>Date: ___ / ___ / ____</div></div>'
    +'<div class="sig-block"><div class="sig-name">Medical Superintendent</div><div class="sig-det">'+HOSPITAL.name+'<br>Date: ___ / ___ / ____</div></div></div>'
    +'<div class="foot">M&M Meeting Minutes · '+HOSPITAL.name+' · '+fmtDate(m.meeting_date)+' · Generated by DGHDAP</div>'
    +'</div></body></html>';
  const blob=new Blob([html],{type:'text/html'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);
  a.download='MM_Minutes_'+m.meeting_date+'.html';
  document.body.appendChild(a);a.click();document.body.removeChild(a);
  notify('Minutes downloaded ✓ Open in Chrome → Print → Save as PDF','ok');
